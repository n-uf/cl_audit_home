# Scheduled publishing: every day at 00:10 UTC, pages merged as `draft: true` whose `published` date has come
# are flipped to `draft: false` (scripts/publish-due.mjs), committed as `publish: <slug>[, <slug>]` and pushed to main.
# Vercel builds that push through its Git connection like any other. Nothing due: no commit, no deploy.
# Undo: revert the publish commit, or set `draft: true` again. No secrets and no deploy hooks are used.
# GitHub can run a schedule up to about an hour late, and switches schedules off in a repo with no activity for
# 60 days: re-enable it from the Actions tab if that happens.
name: publish

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Flip due drafts
        run: node scripts/publish-due.mjs | tee "$RUNNER_TEMP/due.txt"

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing due."
            exit 0
          fi
          slugs=$(paste -sd, "$RUNNER_TEMP/due.txt" | sed 's/,/, /g')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content
          git commit -m "publish: ${slugs}"
          git pull --rebase origin main
          git push origin HEAD:main

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- An original light desktop wallpaper for the silver faceplate: soft colour fields and broad translucent
       ribbons, in the spirit of a light Mac desktop. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset=".55" stop-color="#f3eee9"/>
      <stop offset="1" stop-color="#ece6ef"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="110"/></filter>
    <filter id="silk" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".7" stop-color="#dfe8fb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".4" stop-color="#fde6d8" stop-opacity=".7"/>
      <stop offset=".8" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6dcf7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e6dcf7" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <!-- colour fields -->
  <g filter="url(#soft)" opacity=".9">
    <ellipse cx="1240" cy="170" rx="520" ry="300" fill="#a9c6f2"/>
    <ellipse cx="260" cy="840" rx="560" ry="300" fill="#f6bca4"/>
    <ellipse cx="820" cy="470" rx="420" ry="260" fill="#cdbbee"/>
    <ellipse cx="1430" cy="880" rx="420" ry="240" fill="#ffd8b6"/>
    <ellipse cx="160" cy="140" rx="360" ry="220" fill="#d6e6f6"/>
  </g>
  <!-- ribbons -->
  <g filter="url(#silk)">
    <path d="M-120 640 C 220 470, 520 760, 860 600 S 1420 300, 1760 420 L 1760 520 C 1420 400, 1160 700, 860 720 S 220 600, -120 760 Z" fill="url(#r1)"/>
    <path d="M-120 300 C 260 180, 560 420, 940 330 S 1460 120, 1760 210 L 1760 270 C 1460 190, 1220 420, 940 420 S 300 270, -120 380 Z" fill="url(#r2)"/>
    <path d="M-120 900 C 300 780, 700 960, 1060 860 S 1520 700, 1760 760 L 1760 820 C 1500 780, 1300 960, 1060 960 S 360 880, -120 990 Z" fill="url(#r3)"/>
  </g>
  <!-- a faint fine sheen across -->
  <path d="M-100 560 C 300 420, 700 700, 1100 560 S 1500 380, 1700 440" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M-100 240 C 340 130, 640 360, 1000 270 S 1480 100, 1700 160" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
